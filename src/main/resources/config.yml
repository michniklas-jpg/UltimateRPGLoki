
settings:
  language: de
  debug: false

database:
  type: sqlite
  file: database.db
  autosave-interval: 300

player:
  starting-coins: 100
  starting-level: 1
  starting-skill-points: 0

rpg:
  max-level: 100
  xp-base: 100
  xp-multiplier: 1.35

battlepass:
  enabled: true
  max-level: 50
  xp-per-level: 1000
  season-duration-days: 60

quests:
  enabled: true
  daily-count: 3
  weekly-count: 5
  daily-reset-hour: 0

rifts:
  enabled: true
  max-active-rifts: 3
  duration-seconds: 900

meteors:
  enabled: true
  minimum-interval-minutes: 60
  maximum-interval-minutes: 180

weapons:
  enabled: true
  ability-particles: true

skills:
  enabled: true
  maximum-points-per-skill: 10

messages:
  prefix: "&8[&6UltimateRPG&8] "
  no-permission: "&cDafür hast du keine Berechtigung."
  player-only: "&cDieser Befehl ist nur für Spieler."
  player-loaded: "&aDein RPG-Profil wurde geladen."
  database-error: "&cEs gab einen Datenbankfehler."

  no-permission: "&cDafür hast du keine Berechtigung!"
  player-only: "&cDieser Befehl ist nur für Spieler!"
