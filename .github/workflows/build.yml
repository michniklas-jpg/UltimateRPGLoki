
name: Build UltimateRPG

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check Java
        run: java -version

      - name: Build Plugin
        run: mvn --batch-mode clean package

      - name: Upload Plugin
        uses: actions/upload-artifact@v5
        with:
          name: UltimateRPG
          path: target/*.jar
